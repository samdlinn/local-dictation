name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev libevdev-dev libasound2-dev pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-layer-shell-dev libopenblas-dev patchelf libfuse2t64
      - run: bun install --frozen-lockfile
      - run: python scripts/check-local-policy.py
      - run: bun run lint
      - name: Build offline cleanup engine
        run: python scripts/prepare-local-runtime.py
      - name: Build desktop installer
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          retention-days: 1
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      VERSION_NAME: "0.1.0"
      VERSION_CODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android native tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.31.6' 'cmake;3.22.1'
      - name: Restore app signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      - name: Test and build Android app
        working-directory: android
        run: ./gradlew :app:assembleDebug :core:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          retention-days: 1
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk
